
name: Build O.C.C Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OCC_Engineering_App_Full_Services.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Flutter project ZIP
        run: |
          ZIP_PATH=$(find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.zip.zip" \) | head -n 1)

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: No project ZIP found in repository root!"
            ls -la
            exit 1
          fi

          echo "Using project archive: $ZIP_PATH"
          mkdir -p app
          unzip -q "$ZIP_PATH" -d app

          PROJECT_DIR=$(find app -name pubspec.yaml -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found!"
            exit 1
          fi

          echo "APP_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project found at: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android platform
        working-directory: app
        run: |
          cd "$GITHUB_WORKSPACE/$APP_DIR"

          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Check project
        run: flutter analyze --no-pub
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}

      - name: Build Release APK
        run: flutter build apk --release
        working-directory: ${{ env.APP_DIR }}

      - name: Verify APK
        run: |
          APK="${APP_DIR}/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OCC-Engineering-Full-Services-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
