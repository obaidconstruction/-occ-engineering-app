name: Build O.C.C Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OCC_Engineering_App_Full_Services.zip'
      - 'OCC_Engineering_App_Full_Services.zip.zip'
      - 'assets/occ_official_icon.webp'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Flutter project ZIP
        run: |
          ZIP_PATH=$(find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.zip.zip" \) | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: No project ZIP found in repository root!"
            ls -la
            exit 1
          fi
          echo "Using project archive: $ZIP_PATH"
          mkdir -p app
          unzip -q "$ZIP_PATH" -d app
          PROJECT_DIR=$(find app -name pubspec.yaml -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Flutter project not found!"
            exit 1
          fi
          echo "APP_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project found at: $PROJECT_DIR"

      - name: Fix known Dart closing-brace typos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/lib/main.dart")
          lines = p.read_text(encoding="utf-8").splitlines()
          for n in (147, 151, 156):
              i = n - 1
              if i < len(lines) and lines[i].rstrip().endswith("));}}"):
                  lines[i] = lines[i].rstrip()[:-1]
              else:
                  raise SystemExit(f"Unexpected source at lib/main.dart:{n}: {lines[i] if i < len(lines) else 'EOF'}")
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("Corrected the three extra closing braces.")
          PY

      - name: Remove Projects service completely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/lib/main.dart")
          s = p.read_text(encoding="utf-8")

          # Remove the Projects tab and make Profile the third tab.
          s, n1 = re.subn(
              r"(?m)^\s*: tab == 2\n\s*\? ProjectsPage\(pashto: pashto\)\n\s*: _ProfileTab\(pashto: pashto\),",
              "                : _ProfileTab(pashto: pashto),", s)
          if n1 != 1:
              raise SystemExit(f"Expected one Projects tab branch, found {n1}")

          # Remove the Projects bottom-navigation destination.
          s, n2 = re.subn(
              r"(?m)^\s*NavigationDestination\([^\n]*label: t\('پروژې', 'Projects'\)\),\n", "", s)
          if n2 != 1:
              raise SystemExit(f"Expected one Projects navigation item, found {n2}")

          # Remove Projects from the tool-page routing list.
          s, n3 = re.subn(r"(?m)^\s*ProjectsPage\(pashto: pashto\),\n", "", s)
          if n3 != 1:
              raise SystemExit(f"Expected one Projects route entry, found {n3}")

          # Remove the Projects service card from the services list.
          s, n4 = re.subn(
              r"(?m)^\s*\[Icons\.apartment, t\('پروژې', 'Projects'\), t\('د پروژو معلومات او ثبت', 'Project information and entry'\)\],\n", "", s)
          if n4 != 1:
              raise SystemExit(f"Expected one Projects service card, found {n4}")

          # Remove the Projects page and its state/controller implementation.
          s, n5 = re.subn(
              r"(?m)^class ProjectsPage extends StatefulWidget\{[^\n]*\}\nclass _ProjectsPageState extends State<ProjectsPage>\{[^\n]*\}\n?", "", s)
          if n5 != 1:
              raise SystemExit(f"Expected one Projects implementation, found {n5}")

          if re.search(r"ProjectsPage|Projects|پروژ", s, re.IGNORECASE):
              raise SystemExit("Projects references remain in main.dart; refusing incomplete removal")

          p.write_text(s, encoding="utf-8")
          print("Projects service, navigation item, route, page and state code removed.")
          PY

      - name: Enable Camera Measurement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          app = Path(os.environ["APP_DIR"])
          p = app / "lib/main.dart"
          s = p.read_text(encoding="utf-8")
          if "import 'dart:io';" not in s:
              s = s.replace("import 'dart:math' as math;\n", "import 'dart:math' as math;\nimport 'dart:io';\nimport 'package:image_picker/image_picker.dart';\n", 1)
          new_class = r"""
          class CameraMeasurePage extends StatefulWidget {
            final bool pashto;
            const CameraMeasurePage({super.key, required this.pashto});
            @override
            State<CameraMeasurePage> createState() => _CameraMeasurePageState();
          }
          class _CameraMeasurePageState extends State<CameraMeasurePage> {
            final picker = ImagePicker();
            final reference = TextEditingController();
            XFile? photo;
            final List<Offset> points = [];
            double? referencePixels;
            double? result;
            String t(String p, String e) => widget.pashto ? p : e;
            Future<void> takePhoto() async {
              try {
                final file = await picker.pickImage(source: ImageSource.camera, imageQuality: 90);
                if (file != null && mounted) setState(() { photo = file; points.clear(); result = null; referencePixels = null; });
              } catch (_) {
                if (mounted) _message(context, t('کمره پرانیستل نه شول. د کمرې اجازه وګورئ.', 'Could not open camera. Check camera permission.'));
              }
            }
            void measure(TapDownDetails d, Size size) {
              if (photo == null || points.length >= 4) return;
              setState(() {
                points.add(Offset(d.localPosition.dx / size.width, d.localPosition.dy / size.height));
                if (points.length == 2) {
                  final known = double.tryParse(reference.text.replaceAll(',', '.'));
                  if (known == null || known <= 0) {
                    points.clear();
                    _message(context, t('د مرجع اوږدوالی په سانتي‌متر ولیکئ.', 'Enter the reference length in centimetres.'));
                  } else {
                    final dx = (points[1].dx - points[0].dx) * size.width;
                    final dy = (points[1].dy - points[0].dy) * size.height;
                    referencePixels = math.sqrt(dx * dx + dy * dy);
                  }
                } else if (points.length == 4 && referencePixels != null) {
                  final dx = (points[3].dx - points[2].dx) * size.width;
                  final dy = (points[3].dy - points[2].dy) * size.height;
                  final objectPixels = math.sqrt(dx * dx + dy * dy);
                  result = objectPixels / referencePixels! * double.parse(reference.text.replaceAll(',', '.'));
                }
              });
            }
            @override
            void dispose() { reference.dispose(); super.dispose(); }
            @override
            Widget build(BuildContext context) => _pageScaffold(context, t('د کمرې اندازه‌ګیري','Camera Measurement'), ListView(padding: const EdgeInsets.all(16), children: [
              _note(t('عکس واخله او په عکس کې یو معلوم اوږدوالی (لکه متر) وښیه. د هغه دواړه سرونه وټاکه، بیا د اندازه کېدونکي شي دواړه سرونه وټاکه.', 'Take a photo with a known length (such as a tape measure) visible. Tap its two endpoints, then tap the two endpoints of the object.')),
              const SizedBox(height: 12),
              _field(reference, t('د معلوم اوږدوالي اندازه (سانتي‌متر)','Known length (cm)'), keyboard: TextInputType.number),
              const SizedBox(height: 10),
              FilledButton.icon(onPressed: takePhoto, icon: const Icon(Icons.camera_alt), label: Text(t('کمره پرانیزه او عکس واخله','Open camera and take photo'))),
              if (photo != null) ...[
                const SizedBox(height: 12),
                Text(t('لومړی د معلوم متر دوه سرونه، بیا د شي دوه سرونه وټاکه.', 'Tap the two endpoints of the known reference first, then the object.'), style: const TextStyle(fontWeight: FontWeight.w700)),
                LayoutBuilder(builder: (context, constraints) {
                  final size = Size(constraints.maxWidth, constraints.maxWidth * 1.25);
                  return GestureDetector(onTapDown: (d) => measure(d, size), child: SizedBox(width: size.width, height: size.height, child: Stack(fit: StackFit.expand, children: [
                    Image.file(File(photo!.path), fit: BoxFit.fill),
                    CustomPaint(painter: _MeasurePointsPainter(points)),
                  ])));
                }),
                Text(t('ټاکل شوې نقطې: ', 'Selected points: ') + '${points.length}/4'),
                if (result != null) _result(t('اندازه','Measurement'), ['${result!.toStringAsFixed(2)} cm']),
                OutlinedButton(onPressed: () => setState(() { points.clear(); result = null; referencePixels = null; }), child: Text(t('نقطې بیا وټاکه','Reset points'))),
                OutlinedButton(onPressed: takePhoto, child: Text(t('بل عکس واخله','Take another photo'))),
              ],
            ]));
          }
          class _MeasurePointsPainter extends CustomPainter {
            final List<Offset> points;
            _MeasurePointsPainter(this.points);
            @override
            void paint(Canvas canvas, Size size) {
              final paint = Paint()..color = Colors.red..style = PaintingStyle.fill;
              for (final p in points) { canvas.drawCircle(Offset(p.dx * size.width, p.dy * size.height), 7, paint); }
              if (points.length >= 2) {
                canvas.drawLine(Offset(points[0].dx * size.width, points[0].dy * size.height), Offset(points[1].dx * size.width, points[1].dy * size.height), Paint()..color = Colors.red..strokeWidth = 3);
              }
              if (points.length >= 4) {
                canvas.drawLine(Offset(points[2].dx * size.width, points[2].dy * size.height), Offset(points[3].dx * size.width, points[3].dy * size.height), Paint()..color = Colors.green..strokeWidth = 3);
              }
            }
            @override
            bool shouldRepaint(covariant _MeasurePointsPainter old) => old.points != points;
          }
          """
          pattern = r"class CameraMeasurePage extends StatelessWidget\s*\{.*?(?=\nclass )"
          s, n = re.subn(pattern, new_class.strip() + "\n", s, flags=re.S)
          if n != 1:
              raise SystemExit(f"Could not replace CameraMeasurePage (matches={n})")
          s = s.replace("t('د اندازې لارښود او ثبت', 'Measurement guide and notes')", "t('د کمرې له لارې اندازه کول', 'Measure with camera')")
          p.write_text(s, encoding="utf-8")
          pub = app / "pubspec.yaml"
          ps = pub.read_text(encoding="utf-8")
          if "image_picker:" not in ps:
              ps = ps.replace("  url_launcher: ^6.3.2", "  url_launcher: ^6.3.2\n  image_picker: ^1.1.2")
          pub.write_text(ps, encoding="utf-8")
          print("Camera photo capture and reference-based measurement enabled.")
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Generate Android platform
        run: |
          cd "$GITHUB_WORKSPACE/$APP_DIR"
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Apply official O.C.C launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          APP="$GITHUB_WORKSPACE/$APP_DIR"
          RES="$APP/android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/values"
          convert "$GITHUB_WORKSPACE/assets/occ_official_icon.webp" -resize 432x432^ -gravity center -extent 432x432 "$RES/drawable-nodpi/occ_launcher.png"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            mkdir -p "$RES/mipmap-$1"
            convert "$GITHUB_WORKSPACE/assets/occ_official_icon.webp" -resize "${2}x${2}^" -gravity center -extent "${2}x${2}" "$RES/mipmap-$1/ic_launcher.png"
            cp "$RES/mipmap-$1/ic_launcher.png" "$RES/mipmap-$1/ic_launcher_round.png"
          done
          cat > "$RES/values/occ_icon_colors.xml" <<'EOF'
          <resources>
              <color name="occ_launcher_background">#050505</color>
          </resources>
          EOF
          mkdir -p "$RES/mipmap-anydpi-v26"
          for icon in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$icon.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/occ_launcher_background" />
              <foreground android:drawable="@drawable/occ_launcher" />
          </adaptive-icon>
          EOF
          done
          echo "Official O.C.C launcher icon applied."

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ env.APP_DIR }}

      - name: Check project
        run: flutter analyze --no-pub
        continue-on-error: true
        working-directory: ${{ env.APP_DIR }}

      - name: Build Release APK
        run: flutter build apk --release
        working-directory: ${{ env.APP_DIR }}

      - name: Verify APK
        run: |
          APK="${APP_DIR}/build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OCC-Engineering-Full-Services-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${APP_DIR}/build/app/outputs/flutter-apk/app-release.apk"
          cp "$APK" OCC_Engineering.apk
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --title "O.C.C Engineering v1.0.0" --notes "O.C.C Engineering Android application. Download OCC_Engineering.apk below."
          fi
          gh release upload v1.0.0 OCC_Engineering.apk --clobber
