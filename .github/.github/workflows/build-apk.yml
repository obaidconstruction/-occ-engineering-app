name: Build O.C.C Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OCC_Engineering_App_Starter.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Unzip Flutter project
        run: |
          unzip -o OCC_Engineering_App_Starter.zip -d app
          test -f app/pubspec.yaml
          test -f app/lib/main.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: occ-engineering-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
